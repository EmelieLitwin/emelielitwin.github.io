<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts - Dual Typography System -->

    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&family=Roboto+Mono:wght@300;400;500&family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Primary Meta Tags -->
    <title>Emelie Litwin - Design Technologist | Design Systems & Accessibility</title>
    <meta name="title" content="Emelie Litwin - Design Technologist | Design Systems & Accessibility" />
    <meta name="description" content="Design Technologist specializing in design systems, web components, and accessible digital experiences. Building delightful interfaces at the intersection of design and code." />

    <meta property="og:description" content="Design Technologist specializing in design systems, web components, and accessible digital experiences." />

    <meta property="twitter:title" content="Emelie Litwin - Design Technologist" />
    <meta property="twitter:description" content="Design Technologist specializing in design systems, web components, and accessible digital experiences." />
    <meta property="twitter:image" content="https://emelielitwin.se/og-image.png" />
    
    <!-- Additional SEO -->
    <link rel="canonical" href="https://emelielitwin.se/" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="theme-color" content="#0A0E1A" />
    
    <!-- Structured Data (JSON-LD) for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Emelie Litwin",
      "jobTitle": "Design Technologist",
      "url": "https://emelielitwin.se",
      "sameAs": [
        "https://www.linkedin.com/in/emelielitwin",
        "https://github.com/EmelieLitwin"
      ],
      "worksFor": {
        "@type": "Organization",
        "name": "Scania"
      },
      "description": "Design Technologist specializing in design systems, web components, and accessible digital experiences. Building delightful interfaces at the intersection of design and code.",
      "knowsAbout": [
        "Design Systems",
        "Accessibility",
        "WCAG",
        "Web Components",
        "React",
        "TypeScript",
        "UI/UX Design",
        "Frontend Development",
        "Figma",
        "Design Tokens"
      ],
      "alumniOf": {
        "@type": "EducationalOrganization",
        "name": "Hyper Island"
      }
    }

    <!-- Set default theme to dark before page loads to prevent flash -->
    <script>
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
  </head>
